[project]
name = "at-bridge"
version = "0.1.1"
description = "MCP server for AT command debugging via COM/serial port"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.2",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
at-bridge = "at_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["at_bridge"]

[tool.hatch.build]
include = [
    "at_bridge/chipsets/*.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
    "/at_bridge",
    "/main.py",
    "/README.md",
    "/pyproject.toml",
    "/LICENSE",
]
